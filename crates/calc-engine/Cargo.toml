[package]
name = "calc-engine"
version = "0.1.0"
edition = "2021"
description = "Scientific calculator engine (WASM-ready)"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
